version: "3"

silent: true

vars:
  SYSTEM:
    sh: '[ "$(uname)" = Darwin ] && echo darwin || echo nixos'
  HOSTNAME:
    sh: scutil --get LocalHostName 2>/dev/null || hostname
  FLAKE: "$HOME/dotfiles/system/{{.SYSTEM}}"

  NIX_GH_OPT:
    sh: t=$(gh auth token 2>/dev/null) && echo "--option access-tokens github.com=$t" || true

tasks:
  default:
    cmds:
      - task: edit

  tasks:
    desc: "Show task list"
    cmds:
      - task --list

  edit:
    desc: "Open dotfiles in editor"
    cmds:
      - code ~/dotfiles

  apply:
    desc: "Apply nix-darwin / NixOS configuration"
    cmds:
      - sudo {{.SYSTEM}}-rebuild switch --flake "{{.FLAKE}}#{{.HOSTNAME}}" {{.NIX_GH_OPT}}

  update:
    desc: "Update flake.lock and apply"
    cmds:
      - nix flake update --flake "{{.FLAKE}}" {{.NIX_GH_OPT}}
      - task: apply

  apply:update:
    desc: "Update flake.lock, apply, and push"
    cmds:
      - nix flake update --flake "{{.FLAKE}}" {{.NIX_GH_OPT}}
      - task: apply
      - task: push-flake-lock

  push-flake-lock:
    desc: "Push flake.lock to GitHub"
    internal: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        LOCKFILE="system/{{.SYSTEM}}/flake.lock"
        if [ -z "$(git status --porcelain -- "$LOCKFILE")" ]; then
          echo "flake.lock is up to date, nothing to push"
          exit 0
        fi
        git add "$LOCKFILE"
        git commit -m "chore(deps): update {{.SYSTEM}} flake.lock"
        git push origin HEAD
